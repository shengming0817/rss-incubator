[workspace]
resolver = "3"
members = [
    "apps/reference-device-agent",
    "apps/rotation-*",
    "crates/*",
    "fixtures/rss-conformance-consumer",
    "journeys/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
cognitive_complexity = "deny"
pedantic = "deny"
