[workspace]
resolver = "3"
members = ["apps/rotation-*", "crates/*"]
exclude = [
    "apps/rotation-control",
    "crates/platform-authoring-smoke",
    "crates/rss-device-security-client",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
