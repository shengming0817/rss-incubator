[package]
name = "reference-device-agent-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rotation-model = { path = "../rotation-model" }
rumqttc = "=0.25.1"
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde"] }
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[lints]
workspace = true
