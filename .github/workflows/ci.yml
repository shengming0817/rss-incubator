name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rssRunId:
        description: Exact committed RSS candidate-bundle run; overrides may only repeat the pin.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rss-incubator-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.96.0

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout incubator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
          rustc --version --verbose
          cargo --version --verbose

      - name: Test repository policy scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test Cargo graph policy
        run: bash scripts/test-candidate-graph-policy.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

  candidate-consumption:
    name: candidate-consumption
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact incubator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default "$RUST_VERSION"

      - name: Install pinned coverage driver
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Resolve immutable RSS candidate artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.RSS_ARTIFACTS_READ_TOKEN }}
          RSS_RUN_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.rssRunId || '' }}
        run: |
          set -euo pipefail
          pin="$(jq -ce '
            if .schemaVersion == 1 and
               (.runId | type == "number") and
               (.runAttempt | type == "number") and
               (.rssRevision | test("^[0-9a-f]{40}$")) and
               (.artifactName | type == "string") and
               (.artifactDigest | test("^sha256:[0-9a-f]{64}$"))
            then . else error("candidate pin is malformed") end
          ' .github/rss-candidate.json)"
          run_id="$(jq -er '.runId' <<< "$pin")"
          if [[ -n "$RSS_RUN_OVERRIDE" ]]; then
            [[ "$RSS_RUN_OVERRIDE" =~ ^[1-9][0-9]*$ ]]
            [[ "$RSS_RUN_OVERRIDE" == "$run_id" ]]
          fi
          run_json="$(gh api "repos/shengming0817/rss/actions/runs/$run_id")"
          jq -e --arg revision "$(jq -r '.rssRevision' <<< "$pin")" '
            .path == ".github/workflows/candidate-bundle.yml" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == $revision
          ' <<< "$run_json" >/dev/null
          revision="$(jq -r '.head_sha' <<< "$run_json")"
          attempt="$(jq -r '.run_attempt' <<< "$run_json")"
          artifact_name="rss-candidate-bundle-$revision-$run_id-$attempt"
          artifacts="$(gh api "repos/shengming0817/rss/actions/runs/$run_id/artifacts")"
          artifact="$(jq -c --arg name "$artifact_name" '
            if .total_count != 1 then error("producer run artifact exact-set differs")
            else [.artifacts[] | select(.name == $name and .expired == false)] |
              if length == 1 then .[0] else error("candidate artifact identity differs") end
            end
          ' <<< "$artifacts")"
          digest="$(jq -r '.digest' <<< "$artifact")"
          jq -e \
            --argjson run_id "$run_id" \
            --argjson attempt "$attempt" \
            --arg revision "$revision" \
            --arg name "$artifact_name" \
            --arg digest "$digest" \
            '.runId == $run_id and
             .runAttempt == $attempt and
             .rssRevision == $revision and
             .artifactName == $name and
             .artifactDigest == $digest' \
            <<< "$pin" >/dev/null
          {
            echo "name=$artifact_name"
            echo "revision=$revision"
            echo "attempt=$attempt"
            echo "digest=$digest"
            echo "run-id=$run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact RSS candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/rss-candidate-bundle
          repository: shengming0817/rss
          run-id: ${{ steps.artifact.outputs.run-id }}
          github-token: ${{ secrets.RSS_ARTIFACTS_READ_TOKEN }}

      - name: Bind producer manifest and materialize Cargo transport
        id: transport
        env:
          RSS_EXPECTED_REVISION: ${{ steps.artifact.outputs.revision }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/rss-candidate-bundle"
          manifest="$bundle/candidate-bundle.json"
          jq -e --arg revision "$RSS_EXPECTED_REVISION" '
            .schemaVersion == 1 and
            .rssRevision == $revision and
            (.packages | type == "array" and length > 0) and
            ([.packages[].name] | length == (unique | length)) and
            all(.packages[];
              (.name | test("^rss-[a-z0-9]+(-[a-z0-9]+)*$")) and
              (.version | test("^[0-9A-Za-z.+-]+$")) and
              (.checksum | test("^[0-9a-f]{64}$")))
          ' "$manifest" >/dev/null

          registry="$RUNNER_TEMP/rss-candidate-registry"
          cp -R "$bundle/registry" "$registry"
          jq -cn --arg dl "file://$registry/crates/{crate}/{version}/download" \
            '{dl: $dl}' > "$registry/index/config.json"
          env \
            GIT_AUTHOR_NAME='RSS candidate transport' \
            GIT_AUTHOR_EMAIL='candidate@invalid' \
            GIT_COMMITTER_NAME='RSS candidate transport' \
            GIT_COMMITTER_EMAIL='candidate@invalid' \
            /usr/bin/git -C "$registry/index" init -q
          /usr/bin/git -C "$registry/index" add .
          env \
            GIT_AUTHOR_NAME='RSS candidate transport' \
            GIT_AUTHOR_EMAIL='candidate@invalid' \
            GIT_COMMITTER_NAME='RSS candidate transport' \
            GIT_COMMITTER_EMAIL='candidate@invalid' \
            /usr/bin/git -C "$registry/index" commit -qm 'candidate registry transport'

          cargo_home="$RUNNER_TEMP/rss-candidate-cargo-home"
          mkdir -p "$cargo_home"
          printf '%s\n' \
            '[source.rss-candidate]' \
            'registry = "https://rss-candidate.invalid/index"' \
            'replace-with = "rss-candidate-local"' \
            '' \
            '[source.rss-candidate-local]' \
            "registry = \"file://$registry/index\"" \
            > "$cargo_home/config.toml"
          {
            echo "CARGO_HOME=$cargo_home"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/rss-candidate-target"
            echo "ROOT_LOCK_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
          } >> "$GITHUB_ENV"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Fetch exact root lock
        run: |
          set -euo pipefail
          cargo fetch --locked
          echo 'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"

      - name: Prove registry-only resolved graph
        id: graph
        env:
          BUNDLE_MANIFEST: ${{ steps.transport.outputs.manifest }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/rss-candidate-metadata.json"
          consumed="$RUNNER_TEMP/rss-consumed-packages.json"
          cargo metadata --format-version 1 --locked --offline > "$metadata"
          jq -ce --slurpfile bundle "$BUNDLE_MANIFEST" \
            -f .github/candidate-graph-policy.jq \
            "$metadata" > "$consumed"
          echo "consumed=$consumed" >> "$GITHUB_OUTPUT"

      - name: Verify Docker runtime
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Run disposable reference environment journey
        timeout-minutes: 18
        env:
          REFERENCE_PROJECT: rss-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/reference-environment.py --project "$REFERENCE_PROJECT" smoke

      - name: Collect redacted scoped logs after failure
        timeout-minutes: 1
        if: ${{ failure() || cancelled() }}
        env:
          REFERENCE_PROJECT: rss-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/reference-environment.py --project "$REFERENCE_PROJECT" logs

      - name: Remove scoped runtime state
        timeout-minutes: 2
        if: ${{ always() }}
        env:
          REFERENCE_PROJECT: rss-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/reference-environment.py --project "$REFERENCE_PROJECT" down

      - name: Run locked offline candidate workspace matrix
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked --offline
          cargo test --workspace --all-targets --locked --offline
          cargo test --workspace --doc --locked --offline
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Enforce affected coverage
        run: |
          set -euo pipefail
          cargo llvm-cov \
            --package platform-authoring-smoke \
            --all-targets --locked --offline \
            --fail-under-lines 80
          cargo llvm-cov \
            --package reference-device-agent-core \
            --package reference-device-agent \
            --all-targets --locked --offline \
            --ignore-filename-regex '(^|/)(crates/(rotation-model|rss-device-security-client)|tests/fixtures)/' \
            --fail-under-lines 80
          cargo llvm-cov \
            --package secure-device-rotation-t2-journey \
            --all-targets --locked --offline \
            --ignore-filename-regex '(^|/)(crates/(rotation-model|rss-device-security-client)|tests/fixtures)/' \
            --fail-under-lines 80

      - name: Build release consumers
        run: |
          set -euo pipefail
          cargo build \
            --package reference-device-agent \
            --package rotation-control \
            --release --locked --offline

      - name: Publish canonical first-green receipt
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          BUNDLE_MANIFEST: ${{ steps.transport.outputs.manifest }}
          CONSUMED_PACKAGES: ${{ steps.graph.outputs.consumed }}
          INCUBATOR_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          RSS_EXPECTED_REVISION: ${{ steps.artifact.outputs.revision }}
          RSS_RUN_ATTEMPT: ${{ steps.artifact.outputs.attempt }}
          RSS_RUN_ID: ${{ steps.artifact.outputs.run-id }}
        run: |
          set -euo pipefail
          actual_incubator_revision="$(/usr/bin/git rev-parse HEAD)"
          [[ "$actual_incubator_revision" == "$INCUBATOR_EXPECTED_REVISION" ]]
          [[ "$(sha256sum Cargo.lock | awk '{print $1}')" == "$ROOT_LOCK_SHA256" ]]
          agent_sha="$(sha256sum "$CARGO_TARGET_DIR/release/reference-device-agent" | awk '{print $1}')"
          control_sha="$(sha256sum "$CARGO_TARGET_DIR/release/rotation-control" | awk '{print $1}')"
          receipt="$(jq -cn \
            --arg rss_revision "$RSS_EXPECTED_REVISION" \
            --arg incubator_revision "$actual_incubator_revision" \
            --argjson rss_run_id "$RSS_RUN_ID" \
            --argjson rss_run_attempt "$RSS_RUN_ATTEMPT" \
            --arg producer_url "https://github.com/shengming0817/rss/actions/runs/$RSS_RUN_ID/attempts/$RSS_RUN_ATTEMPT" \
            --argjson consumer_run_id "$GITHUB_RUN_ID" \
            --argjson consumer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg consumer_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg root_lock_sha "$ROOT_LOCK_SHA256" \
            --arg agent_sha "$agent_sha" \
            --arg control_sha "$control_sha" \
            --slurpfile bundle "$BUNDLE_MANIFEST" \
            --slurpfile consumed "$CONSUMED_PACKAGES" '
              {
                schemaVersion: 2,
                rssRevision: $rss_revision,
                incubatorRevision: $incubator_revision,
                producerRun: {
                  id: $rss_run_id,
                  attempt: $rss_run_attempt,
                  url: $producer_url
                },
                consumerRun: {
                  id: $consumer_run_id,
                  attempt: $consumer_run_attempt,
                  url: $consumer_url
                },
                artifact: {
                  name: $artifact_name,
                  digest: $artifact_digest
                },
                packages: [
                  $bundle[0].packages[] + {
                    archiveVcsRevision: $rss_revision,
                    archiveVcsProvenBy: $producer_url
                  }
                ],
                consumedPackages: $consumed[0],
                rootLockSha256: $root_lock_sha,
                registryOnly: true,
                matrix: {
                  check: "passed",
                  test: "passed",
                  doc: "passed",
                  clippy: "passed",
                  locked: true,
                  offline: true
                },
                consumerBinaries: [
                  {name: "reference-device-agent", sha256: $agent_sha},
                  {name: "rotation-control", sha256: $control_sha}
                ]
              }
            ')"
          /usr/bin/git diff --exit-code
          {
            echo '## rss-incubator canonical candidate first-green'
            echo
            echo '```json'
            jq . <<< "$receipt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
