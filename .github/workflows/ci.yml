name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rssRunId:
        description: Exact successful RSS candidate-bundle workflow run ID.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rss-incubator-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout incubator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Test candidate proof policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Test workspace documentation
        run: cargo test --workspace --doc --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  reference-environment:
    name: reference-environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout incubator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Docker runtime
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Run disposable reference environment journey
        timeout-minutes: 17
        env:
          REFERENCE_PROJECT: rss-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/reference-environment.py --project "$REFERENCE_PROJECT" smoke

      - name: Collect redacted scoped logs after failure
        if: ${{ failure() || cancelled() }}
        env:
          REFERENCE_PROJECT: rss-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/reference-environment.py --project "$REFERENCE_PROJECT" logs

      - name: Remove scoped runtime state
        if: ${{ always() }}
        env:
          REFERENCE_PROJECT: rss-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/reference-environment.py --project "$REFERENCE_PROJECT" down

  candidate-proof:
    name: candidate-proof
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout incubator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0

      - name: Resolve immutable RSS candidate artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.RSS_ARTIFACTS_READ_TOKEN }}
          RSS_RUN_ID: ${{ inputs.rssRunId }}
        run: |
          set -euo pipefail
          [[ "$RSS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/shengming0817/rss/actions/runs/$RSS_RUN_ID")"
          jq -e '
            .path == ".github/workflows/candidate-bundle.yml" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' <<< "$run_json" >/dev/null
          revision="$(jq -r '.head_sha' <<< "$run_json")"
          attempt="$(jq -r '.run_attempt' <<< "$run_json")"
          artifact_name="rss-candidate-bundle-$revision-$RSS_RUN_ID-$attempt"
          artifacts="$(gh api "repos/shengming0817/rss/actions/runs/$RSS_RUN_ID/artifacts")"
          artifact="$(jq -c --arg name "$artifact_name" '
            if .total_count != 1 then error("producer run artifact exact-set differs")
            else [.artifacts[] | select(.name == $name and .expired == false)] |
              if length == 1 then .[0] else error("candidate artifact identity differs") end
            end
          ' <<< "$artifacts")"
          digest="$(jq -r '.digest' <<< "$artifact")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "name=$artifact_name"
            echo "revision=$revision"
            echo "attempt=$attempt"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact RSS candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/rss-candidate-bundle
          repository: shengming0817/rss
          run-id: ${{ inputs.rssRunId }}
          github-token: ${{ secrets.RSS_ARTIFACTS_READ_TOKEN }}

      - name: Prove locked offline candidate consumption
        id: proof
        env:
          RSS_EXPECTED_REVISION: ${{ steps.artifact.outputs.revision }}
        run: |
          set -euo pipefail
          proof_log="$RUNNER_TEMP/candidate-proof.log"
          python3 scripts/candidate-proof.py \
            --bundle "$RUNNER_TEMP/rss-candidate-bundle" | tee "$proof_log"
          summary="$(tail -n 1 "$proof_log")"
          jq -e --arg revision "$RSS_EXPECTED_REVISION" \
            '.schemaVersion == 1 and .rssRevision == $revision' <<< "$summary" >/dev/null
          {
            echo 'summary<<RSS_CANDIDATE_SUMMARY'
            echo "$summary"
            echo 'RSS_CANDIDATE_SUMMARY'
          } >> "$GITHUB_OUTPUT"

      - name: Publish first-green summary
        env:
          RSS_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
          RSS_PROOF_SUMMARY: ${{ steps.proof.outputs.summary }}
        run: |
          set -euo pipefail
          {
            echo '## rss-incubator candidate first-green'
            echo
            echo "- RSS producer run: https://github.com/shengming0817/rss/actions/runs/${{ inputs.rssRunId }}/attempts/${{ steps.artifact.outputs.attempt }}"
            echo "- Incubator candidate run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
            echo "- RSS revision: \`$(jq -r '.rssRevision' <<< "$RSS_PROOF_SUMMARY")\`"
            echo "- Incubator revision: \`$(jq -r '.incubatorRevision' <<< "$RSS_PROOF_SUMMARY")\`"
            echo "- Artifact digest: \`$RSS_ARTIFACT_DIGEST\`"
            echo "- Candidate lock SHA-256: \`$(jq -r '.candidateLockSha256' <<< "$RSS_PROOF_SUMMARY")\`"
            echo '- Release Surface packages:'
            jq -r '.packages[] | "  - `\(.name)@\(.version)` — `\(.checksum)`"' <<< "$RSS_PROOF_SUMMARY"
            echo '- Consumed RSS packages:'
            jq -r '.consumedPackages[] | "  - `\(.)`"' <<< "$RSS_PROOF_SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
