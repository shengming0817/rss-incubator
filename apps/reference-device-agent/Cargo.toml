[package]
name = "reference-device-agent"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
reference-device-agent-core = { path = "../../crates/reference-device-agent-core" }
rotation-model = { path = "../../crates/rotation-model" }
rss-device-security-client = { path = "../../crates/rss-device-security-client" }
rss-device-security-contracts = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde"] }

[lints]
workspace = true
