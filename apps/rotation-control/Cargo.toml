[package]
name = "rotation-control"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rotation-model = { path = "../../crates/rotation-model" }
rss-device-security-client = { path = "../../crates/rss-device-security-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webbrowser = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
